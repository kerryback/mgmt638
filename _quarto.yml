project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - syllabus.qmd
    # Decks are added here one at a time, as each is ready -- deliberately not
    # globbed as slides/*.qmd, which would publish every unwritten starter deck
    # in the folder. Uncomment a line when that session's deck is finished; it
    # renders into docs/slides/ as reveal.js (see slides/_metadata.yml).
    - slides/session01.qmd
    - slides/session02.qmd
    - slides/session03.qmd
    - slides/session04.qmd
    # - slides/session05.qmd
    # - slides/session06.qmd
    # - slides/session07.qmd
    # - slides/session08.qmd
    # - slides/session09.qmd
    # - slides/session10.qmd
    # - slides/session11.qmd
    # - slides/session12.qmd

  resources:
    - CNAME
    - .nojekyll
    - under-construction.html
    # Standalone reading, linked from the decks. Not rendered -- it is
    # hand-written HTML, so it is copied through verbatim to docs/.
    # Anchored with a leading slash: a bare "aqr-report.html" is a glob that
    # matches the name anywhere in the tree, so it also picked up the staging
    # copy in files/session01/ and published it loose beside the zip.
    - /aqr-report.html
    - images/RiceBusiness-transparent-logo-sm.png
    - images/headshot-keeper-cropped2.png
    # Session material, linked from the schedule rows in index.qmd.
    #
    # The decks themselves are rendered, not copied, so they are not listed
    # here -- slides/*.qmd is in the render list above.
    #
    # These PDFs are produced by decktape (see .claude/commands/deck.md), which
    # writes pdf/<stem>.pdf and mirrors it into docs/pdf/. Listing them here is
    # what stops a later full render from dropping that mirrored copy. A file
    # that does not exist yet is skipped with a warning, so the whole term can
    # be listed up front.
    - pdf/session01.pdf
    - pdf/session02.pdf
    - pdf/session03.pdf
    - pdf/session04.pdf
    - pdf/session05.pdf
    - pdf/session06.pdf
    - pdf/session07.pdf
    - pdf/session08.pdf
    - pdf/session09.pdf
    - pdf/session10.pdf
    - pdf/session11.pdf
    - pdf/session12.pdf
    # Nothing under files/ is published. The staging folders files/session01..12
    # are local, and the zip built from each one is distributed from
    # ~/Dropbox/mgmt638-files/ -- the schedule rows link the Dropbox share URL,
    # so a 40MB+ download never enters the repo or its history.

website:
  title: ""
  search: false
  navbar:
    search: false
    title: MGMT 638
    href: index.html
    right:
        - text: Data Guide
          href: https://portal-guide.rice-business.org
          target: _blank

format:
  html:
    theme:
      light: flatly
      dark: superhero
    link-external-newwindow: true
