# Applies to every deck in slides/, so they render as reveal.js as part of the
# website build (the root _quarto.yml renders slides/*.qmd into docs/slides/).
# index.qmd and syllabus.qmd stay at the project root: a file in this folder
# cannot opt out of the revealjs format below.
#
# theme, width and height are deliberately NOT set here. Quarto appends a
# document's theme list to the one in _metadata.yml rather than replacing it, so
# a deck that wants a different theme would silently get both. Every deck here
# declares shoji.scss on a 1280x720 canvas in its own front matter.
#
# The canvas size is load bearing: the theme specifies its grid in px against
# 1280x720, and a mismatch puts every rectangle in the wrong place. Copy the
# format block from a neighbouring deck rather than inventing one.
#
# margin: 0 is shared. Reveal's default 10% margin scales the canvas by 0.9,
# landing every edge on a fractional device pixel and leaving 1px slivers of the
# wrong colour along the seams.
# Each deck's date: is the ISO class date; this renders it readably. Quarto
# silently falls back to 1 January when it cannot parse a date, so keep them ISO.
date-format: "ddd MMM D, YYYY"

format:
  revealjs:
    margin: 0
    slide-number: c/t
    footer: "MGMT 638 &middot; Gen AI and Quantitative Investments"
    highlight-style: github
    html-math-method: mathjax
