# Applies to every deck in slides/, so they render as reveal.js as part of the
# website build (the root _quarto.yml renders slides/*.qmd into docs/slides/).
# index.qmd and syllabus.qmd stay at the project root: a file in this folder
# cannot opt out of the revealjs format below.
#
# Every deck here uses the shoji theme, so it is set once in this file and no
# deck declares a theme of its own. Do not add `theme:` to a deck's front
# matter -- Quarto appends a document's theme list to this one rather than
# replacing it, so the deck would get shoji twice.
#
# width, height and margin are load bearing for shoji: its grid is specified in
# px against a 1050x700 canvas, and reveal's default 10% margin would scale that
# canvas by 0.9, landing every edge on a fractional device pixel and leaving 1px
# slivers of the wrong colour along the seams.
# Each deck's date: is the ISO class date; this renders it readably. Quarto
# silently falls back to 1 January when it cannot parse a date, so keep them ISO.
date-format: "ddd MMM D, YYYY"

format:
  revealjs:
    theme: shoji.scss
    width: 1050
    height: 700
    margin: 0
    slide-number: c/t
    footer: "MGMT 638 &middot; Gen AI and Quantitative Investments"
    highlight-style: github
    html-math-method: mathjax
