<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Under Construction &middot; MGMT 638</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#128679;</text></svg>">
<style>
:root { --navy:#00205B; --gold:#b8912f; --ink:#1a1a1a; --gray:#555; --line:#e4e4e4; --bg:#fff; }
@media (prefers-color-scheme: dark) {
  :root { --navy:#8fb3ff; --gold:#d8b25a; --ink:#e8eaed; --gray:#aab; --line:#2b3038; --bg:#12161c; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "Helvetica Neue", Arial, sans-serif;
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 40px 20px; text-align: center;
}
.sheet { max-width: 560px; }
svg.scene { width: 100%; max-width: 320px; height: auto; margin-bottom: 30px; }
.eyebrow {
  font-size: 14px; letter-spacing: 3.5px; text-transform: uppercase;
  color: var(--gold); font-weight: 700; margin-bottom: 12px;
}
h1 {
  font-family: Georgia, "Times New Roman", serif; font-size: 42px; line-height: 1.15;
  color: var(--navy); font-weight: 700; margin-bottom: 18px;
}
p { font-size: 17px; color: var(--gray); line-height: 1.5; margin-bottom: 10px; }
.rule {
  height: 3px; border-radius: 2px; margin: 28px auto 24px; max-width: 320px;
  background: linear-gradient(90deg, var(--navy) 0 62%, var(--gold) 62% 100%);
}
a.back { font-size: 17px; font-weight: 700; color: var(--navy); text-decoration: none; }
a.back:hover { text-decoration: underline; }
@media (max-width: 520px) { h1 { font-size: 32px; } p { font-size: 16px; } }
</style>
</head>
<body>
  <div class="sheet">

    <!-- A barricade and cone, drawn inline so the page needs nothing else.
         Hazard stripes are the site's navy and gold rather than the usual
         orange, so the page still looks like it belongs to the site. -->
    <svg class="scene" viewBox="0 0 240 150" role="img"
         aria-label="A construction barricade and traffic cone">
      <defs>
        <pattern id="hazard" width="18" height="18" patternUnits="userSpaceOnUse"
                 patternTransform="rotate(45)">
          <rect width="18" height="18" fill="#b8912f"/>
          <rect width="9" height="18" fill="#00205B"/>
        </pattern>
        <pattern id="hazardCone" width="10" height="10" patternUnits="userSpaceOnUse"
                 patternTransform="rotate(45)">
          <rect width="10" height="10" fill="#b8912f"/>
          <rect width="5" height="10" fill="#00205B"/>
        </pattern>
      </defs>

      <!-- ground -->
      <line x1="8" y1="132" x2="232" y2="132" stroke="#c8ccd2" stroke-width="2.5"
            stroke-linecap="round"/>

      <!-- barricade legs -->
      <g stroke="#00205B" stroke-width="7" stroke-linecap="round">
        <line x1="58" y1="60" x2="44" y2="131"/>
        <line x1="44" y1="60" x2="58" y2="131"/>
        <line x1="164" y1="60" x2="150" y2="131"/>
        <line x1="150" y1="60" x2="164" y2="131"/>
      </g>

      <!-- barricade planks -->
      <rect x="26" y="52" width="156" height="24" rx="4" fill="url(#hazard)"/>
      <rect x="26" y="52" width="156" height="24" rx="4" fill="none"
            stroke="#00205B" stroke-width="2.5"/>
      <rect x="26" y="88" width="156" height="18" rx="4" fill="url(#hazard)"/>
      <rect x="26" y="88" width="156" height="18" rx="4" fill="none"
            stroke="#00205B" stroke-width="2.5"/>

      <!-- traffic cone -->
      <ellipse cx="204" cy="131" rx="22" ry="4.5" fill="#00205B" opacity="0.18"/>
      <path d="M204 74 L221 128 L187 128 Z" fill="url(#hazardCone)"
            stroke="#00205B" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="181" y="126" width="46" height="8" rx="3" fill="#00205B"/>
    </svg>

    <div class="eyebrow">Under Construction</div>
    <h1>These slides aren&rsquo;t posted yet</h1>
    <p>The deck for this session is still being written. It will appear here
       before the session runs.</p>
    <div class="rule"></div>
    <a class="back" href="index.html">&larr; Back to the schedule</a>
  </div>
</body>
</html>
